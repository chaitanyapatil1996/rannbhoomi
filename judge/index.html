<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Judge Portal — RANNBHOOMI 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../images/logo-crimson.png">
<style>
:root {
  --crimson: #4c0007;
  --gold: #dec189;
  --parchment: #d6b97a;
  --border: rgba(76,0,7,0.22);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: #d6b97a; font-family: 'Cinzel', serif; color: var(--crimson); }
body { padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }

.screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px 40px; }
.screen.active { display: flex; }

.pin-card { width: 100%; max-width: 400px; background: rgba(214,185,122,0.55); border: 1px solid var(--border); padding: 40px 32px; }
.assignment-badge { font-size: 9px; letter-spacing: 4px; opacity: 0.75; text-transform: uppercase; margin-bottom: 10px; }
.assignment-main { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px; color: var(--crimson); line-height: 1.1; margin-bottom: 4px; }
.assignment-sub { font-size: 12px; letter-spacing: 3px; opacity: 0.85; margin-bottom: 32px; }
.rule { width: 48px; height: 2px; background: var(--crimson); opacity: 0.3; margin-bottom: 32px; }
.field-label { font-size: 9px; letter-spacing: 3px; opacity: 0.75; margin-bottom: 8px; display: block; }
.field-label-lg { font-size: 15px; letter-spacing: 1.5px; opacity: 0.9; font-weight: 700; margin-bottom: 10px; }
.field-input {
  width: 100%; padding: 16px; border: 1px solid var(--border);
  background: rgba(214,185,122,0.4); font-family: 'Cinzel', serif;
  font-size: 15px; color: var(--crimson); outline: none;
  -webkit-appearance: none; border-radius: 0;
}
.field-input:focus { border-color: var(--crimson); background: rgba(214,185,122,0.7); }
.btn-primary {
  width: 100%; margin-top: 20px; padding: 18px;
  background: var(--crimson); color: var(--gold);
  font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 5px;
  border: none; cursor: pointer; transition: opacity .15s;
}
.btn-primary:hover { opacity: .85; }
.btn-primary:disabled { opacity: .35; cursor: not-allowed; }
.msg { margin-top: 16px; font-size: 11px; letter-spacing: 2px; min-height: 18px; text-align: center; }
.msg.err { color: var(--crimson); }
.msg.ok  { color: #1a6b00; }
</style>
</head>
<body>

<!-- ── PIN Screen (fallback when no ?pin= in the URL, or an invalid PIN) ── -->
<div class="screen active" id="pinScreen">
  <div class="pin-card">
    <div class="assignment-badge">Judge Access — Rannbhoomi 2026</div>
    <div class="assignment-main" id="assignmentMain">JUDGE PORTAL</div>
    <div class="assignment-sub" id="assignmentSub">Enter your PIN to begin</div>
    <div class="rule"></div>

    <label class="field-label" for="pinInput">Judge PIN</label>
    <input class="field-input" type="password" id="pinInput" placeholder="••••••" maxlength="12" autocomplete="off"
           onkeydown="if(event.key==='Enter') submitPin()">
    <button class="btn-primary" onclick="submitPin()" id="pinBtn">ENTER</button>
    <div class="msg" id="pinMsg"></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxELQsXchGNJXNDyETPXuFOLNKXNNL48OZcG0IRtS-eohXx9gOSP-ZFC1J0PHl-QjNG/exec';

let judge = null;

// ── Init ──────────────────────────────────────────────────────────────────────

(function init() {
  const params = new URLSearchParams(location.search);
  const pin = params.get('pin') || sessionStorage.getItem('judge_pin') || '';
  if (pin) {
    document.getElementById('pinInput').value = pin;
    verifyPin(pin);
  }
})();

function submitPin() {
  const entered = document.getElementById('pinInput').value.trim();
  if (!entered) return;
  verifyPin(entered);
}

async function verifyPin(pin) {
  const btn = document.getElementById('pinBtn');
  const msg = document.getElementById('pinMsg');
  btn.disabled = true;
  btn.textContent = 'CHECKING...';
  msg.textContent = '';
  msg.className = 'msg';

  try {
    const res  = await fetch(`${APPS_SCRIPT_URL}?action=judge_login&pin=${encodeURIComponent(pin)}`);
    const data = await res.json();

    if (!data.found) {
      msg.textContent = 'PIN not recognized';
      msg.className = 'msg err';
      btn.disabled = false;
      btn.textContent = 'ENTER';
      return;
    }

    judge = data.judge;
    sessionStorage.setItem('judge_pin', pin);

    if (String(judge.battle) === '2') {
      location.href = 'battle2.html?pin=' + encodeURIComponent(pin);
      return;
    }
    if (String(judge.battle) === '3') {
      location.href = 'battle3.html?pin=' + encodeURIComponent(pin);
      return;
    }
    if (String(judge.battle) === 'gym') {
      location.href = 'gym.html?pin=' + encodeURIComponent(pin);
      return;
    }
    if (String(judge.battle) === '1') {
      location.href = (judge.station === 'checkin' ? 'checkin.html' : 'battle1.html') + '?pin=' + encodeURIComponent(pin);
      return;
    }
    msg.textContent = 'Unknown assignment for this PIN';
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'ENTER';
  } catch (err) {
    msg.textContent = 'Connection failed — try again';
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'ENTER';
  }
}

function logout() {
  sessionStorage.removeItem('judge_pin');
  location.href = 'index.html';
}
</script>
</body>
</html>
