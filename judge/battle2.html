<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Battle 2 Judge — RANNBHOOMI 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../images/logo-crimson.png">
<style>
:root { --crimson:#4c0007; --gold:#dec189; --parchment:#d6b97a; --border:rgba(76,0,7,0.22); --ok:#1a6b00; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { min-height:100%; background:#d6b97a; font-family:'Cinzel',serif; color:var(--crimson); }
body { padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); }

.screen { display:none; min-height:100vh; flex-direction:column; align-items:center; justify-content:center; padding:28px 18px 40px; }
.screen.active { display:flex; }
.card { width:100%; max-width:460px; background:rgba(214,185,122,0.55); border:1px solid var(--border); padding:32px 26px; }

.badge { font-size:9px; letter-spacing:4px; opacity:0.75; text-transform:uppercase; margin-bottom:10px; }
.title { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:2px; color:var(--crimson); line-height:1.1; margin-bottom:4px; }
.sub { font-size:12px; letter-spacing:2px; opacity:0.85; margin-bottom:24px; }
.rule { width:44px; height:2px; background:var(--crimson); opacity:0.3; margin-bottom:24px; }

.field-label { font-size:9px; letter-spacing:3px; opacity:0.75; margin-bottom:8px; display:block; }
select.field-input, .field-input {
  width:100%; padding:14px; border:1px solid var(--border);
  background:rgba(214,185,122,0.4); font-family:'Cinzel',serif;
  font-size:14px; color:var(--crimson); outline:none; -webkit-appearance:none; border-radius:0;
}
.field-input:focus { border-color:var(--crimson); background:rgba(214,185,122,0.7); }
.btn-primary {
  width:100%; margin-top:18px; padding:16px;
  background:var(--crimson); color:var(--gold);
  font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:4px;
  border:none; cursor:pointer; transition:opacity .15s;
}
.btn-primary:hover { opacity:.85; }
.btn-primary:disabled { opacity:.35; cursor:not-allowed; }
.btn-secondary {
  width:100%; margin-top:12px; padding:12px;
  background:transparent; color:var(--crimson); border:1px solid var(--border);
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px; cursor:pointer;
}
.btn-secondary:hover { background:rgba(76,0,7,0.06); }
.msg { margin-top:14px; font-size:11px; letter-spacing:2px; min-height:16px; text-align:center; }
.msg.err { color:var(--crimson); }
.msg.ok  { color:var(--ok); }

/* Heat screen */
.heat-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
.athlete-name { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1px; line-height:1.1; }
.athlete-meta { font-size:10px; letter-spacing:2px; opacity:0.8; margin-top:4px; }
.round-badge { background:var(--crimson); color:var(--gold); font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; padding:6px 12px; white-space:nowrap; }

.stations { display:flex; flex-direction:column; gap:8px; margin:20px 0; }
.station-row { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1px solid var(--border); background:rgba(214,185,122,0.3); }
.station-row.done { background:rgba(26,107,0,0.08); border-color:rgba(26,107,0,0.3); }
.station-row.active { background:rgba(76,0,7,0.1); border-color:var(--crimson); }
.st-name { font-size:13px; letter-spacing:1px; }
.st-target { font-size:11px; opacity:0.8; }
.st-val { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--ok); }

.big-btn {
  width:100%; padding:22px; margin-top:6px;
  background:var(--crimson); color:var(--gold);
  font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:4px;
  border:none; cursor:pointer; transition:opacity .15s;
}
.big-btn:hover { opacity:.85; }
.big-btn:disabled { opacity:.35; cursor:not-allowed; }

.whistle-toggle {
  width:100%; margin-top:14px; padding:10px; background:none; border:1px solid var(--border);
  color:var(--crimson); font-family:'Cinzel',serif; font-size:10px; letter-spacing:2px; cursor:pointer;
}
.whistle-box { display:none; margin-top:14px; padding:16px; border:1px dashed var(--border); background:rgba(76,0,7,0.04); }
.whistle-box.open { display:block; }
.whistle-box .field-label { margin-top:0; }
.whistle-box .big-input {
  width:100%; padding:14px; text-align:center; border:2px solid var(--border);
  background:rgba(214,185,122,0.5); font-family:'Bebas Neue',sans-serif; font-size:32px; color:var(--crimson);
  outline:none; -webkit-appearance:none; border-radius:0; margin-bottom:10px;
}
.whistle-confirm {
  width:100%; padding:14px; background:var(--crimson); color:var(--gold);
  font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:3px; border:none; cursor:pointer;
}

.result-line { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(76,0,7,0.1); font-size:12px; letter-spacing:1px; }
.result-line .rl-val { font-family:'Bebas Neue',sans-serif; font-size:18px; }

.btn-logout { margin-top:24px; padding:10px 18px; background:transparent; color:var(--crimson); border:1px solid var(--border); font-family:'Cinzel',serif; font-size:9px; letter-spacing:3px; cursor:pointer; opacity:0.65; }
.btn-logout:hover { opacity:1; }
</style>
</head>
<body>

<!-- ── PIN redirect landing (shouldn't normally be seen — index.html handles PIN entry) ── -->
<div class="screen active" id="loadingScreen">
  <div class="card"><div class="title">LOADING…</div></div>
</div>

<!-- ── Start heat: pick athlete ── -->
<div class="screen" id="startScreen">
  <div class="card">
    <div class="badge">Battle 2 Judge — Rannbhoomi 2026</div>
    <div class="title" id="laneTitle">—</div>
    <div class="sub">Select the athlete for this heat</div>
    <div class="rule"></div>

    <label class="field-label" for="athleteSelect">Athlete</label>
    <select class="field-input" id="athleteSelect">
      <option value="">Loading roster…</option>
    </select>

    <button class="btn-primary" id="startBtn" onclick="startHeat()" disabled>START HEAT</button>
    <div class="msg" id="startMsg"></div>
    <button class="btn-logout" onclick="logout()">LOG OUT</button>
  </div>
</div>

<!-- ── Active heat: round/station grid ── -->
<div class="screen" id="heatScreen">
  <div class="card">
    <div class="heat-header">
      <div>
        <div class="athlete-name" id="heatAthleteName">—</div>
        <div class="athlete-meta" id="heatAthleteMeta">—</div>
      </div>
      <div class="round-badge" id="roundBadge">ROUND 1</div>
    </div>
    <div class="rule"></div>

    <div class="stations" id="stationsList"></div>

    <button class="whistle-toggle" onclick="resyncHeat()">REFRESH STATUS FROM SHEET</button>

    <button class="big-btn" id="doneBtn" onclick="stationDone()">STATION DONE</button>

    <button class="whistle-toggle" onclick="toggleWhistle()">WHISTLE BLEW — END HEAT</button>
    <div class="whistle-box" id="whistleBox">
      <label class="field-label">Actual value reached at current station (edit if partial, leave as-is if they just finished it)</label>
      <input class="big-input" type="number" id="whistleValue" min="0">
      <button class="whistle-confirm" onclick="confirmWhistle()">CONFIRM & END HEAT</button>
    </div>

    <div class="msg" id="heatMsg"></div>
    <button class="btn-logout" onclick="logout()">LOG OUT</button>
  </div>
</div>

<!-- ── Heat finished summary ── -->
<div class="screen" id="doneScreen">
  <div class="card">
    <div class="badge">Heat Complete</div>
    <div class="title" id="doneAthleteName">—</div>
    <div class="rule"></div>
    <div id="doneSummary"></div>
    <button class="btn-primary" onclick="newAthlete()">NEXT ATHLETE</button>
    <button class="btn-logout" onclick="logout()">LOG OUT</button>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxELQsXchGNJXNDyETPXuFOLNKXNNL48OZcG0IRtS-eohXx9gOSP-ZFC1J0PHl-QjNG/exec';

const STATIONS = [
  { key: 'rowing',       label: 'Rowing',           target: 500, unit: 'metres' },
  { key: 'devils_press',  label: "Devil's Press",   target: 12,  unit: 'reps' },
  { key: 'kb_walk',       label: 'KB Walk',          target: 100, unit: 'metres' },
  { key: 'box_jump',      label: 'Burpee Box Jump',  target: 10,  unit: 'reps' },
];

let judge = null;
let pin = null;
let currentAthlete = null; // { athlete_id, name, category }
let heatState = {};        // { round, stationsFilled: {key: value}, cumulative: {key: totalAcrossAllRounds}, roundsCompleted }

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

(async function init() {
  const params = new URLSearchParams(location.search);
  pin = params.get('pin') || sessionStorage.getItem('judge_pin') || '';
  if (!pin) { location.href = 'index.html'; return; }

  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=judge_login&pin=${encodeURIComponent(pin)}`);
    const data = await res.json();
    if (!data.found || String(data.judge.battle) !== '2') {
      location.href = 'index.html?pin=' + encodeURIComponent(pin);
      return;
    }
    judge = data.judge;
    sessionStorage.setItem('judge_pin', pin);
    document.getElementById('laneTitle').textContent = judge.label || ('Battle 2 — Lane ' + judge.assignment);
    await loadRoster();
    show('startScreen');
  } catch (err) {
    document.getElementById('loadingScreen').querySelector('.title').textContent = 'CONNECTION FAILED';
  }
})();

async function loadRoster() {
  const gender = String(judge.assignment).startsWith('M') ? 'male' : 'female';
  const sel = document.getElementById('athleteSelect');
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=battle2_roster&gender=${gender}`);
    const data = await res.json();
    const athletes = data.athletes || [];
    if (!athletes.length) {
      sel.innerHTML = '<option value="">No roster found — check Leaderboard_Cache_R1</option>';
      return;
    }
    sel.innerHTML = '<option value="">Select athlete…</option>' +
      athletes.map(a => `<option value="${a.athlete_id}">#${a.rank} — ${escHtml(a.name)}</option>`).join('');
    sel.addEventListener('change', () => {
      document.getElementById('startBtn').disabled = !sel.value;
    });
  } catch {
    sel.innerHTML = '<option value="">Failed to load roster</option>';
  }
}

async function startHeat() {
  const sel = document.getElementById('athleteSelect');
  const athleteId = sel.value;
  const athleteName = sel.options[sel.selectedIndex].textContent;
  const btn = document.getElementById('startBtn');
  const msg = document.getElementById('startMsg');
  btn.disabled = true;
  btn.textContent = 'STARTING…';
  msg.textContent = '';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'battle2_start', pin, athlete_id: athleteId }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed to start heat');

    currentAthlete = { athlete_id: athleteId, name: data.name, category: data.category };
    heatState = { round: data.round, stationsFilled: data.stationsFilled || {}, cumulative: data.cumulative || {}, roundsCompleted: data.roundsCompleted || 0 };
    if (data.resumed) {
      msg.textContent = 'Resumed an in-progress heat for this athlete';
      msg.className = 'msg ok';
    }
    renderHeat();
    show('heatScreen');
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg err';
  }
  btn.disabled = false;
  btn.textContent = 'START HEAT';
}

function renderHeat() {
  document.getElementById('heatAthleteName').textContent = currentAthlete.name;
  document.getElementById('heatAthleteMeta').textContent = String(currentAthlete.category || '').toUpperCase();
  document.getElementById('roundBadge').textContent = 'ROUNDS: ' + (heatState.roundsCompleted || 0);

  // Station rows show the CUMULATIVE total across every round so far (keeps
  // growing round over round, and a whistle-interrupted partial adds onto
  // it automatically) — while "NOW"/next-station logic still comes from
  // stationsFilled, which only tracks the current in-progress round.
  const nextStation = STATIONS.find(s => heatState.stationsFilled[s.key] === undefined);
  const list = document.getElementById('stationsList');
  list.innerHTML = STATIONS.map(s => {
    const doneThisRound = heatState.stationsFilled[s.key] !== undefined;
    const isActive = !doneThisRound && nextStation && nextStation.key === s.key;
    const cumulativeVal = (heatState.cumulative && heatState.cumulative[s.key]) || 0;
    return `<div class="station-row ${doneThisRound ? 'done' : ''} ${isActive ? 'active' : ''}">
      <div>
        <div class="st-name">${s.label}</div>
        <div class="st-target">Target: ${s.target} ${s.unit} / round</div>
      </div>
      <div style="text-align:right;">
        <div class="st-val">${cumulativeVal} ${s.unit}</div>
        ${isActive ? '<div style="font-size:9px;letter-spacing:2px;color:var(--crimson);opacity:.75;font-weight:700;">NOW</div>' : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('doneBtn').textContent = nextStation ? `${nextStation.label.toUpperCase()} DONE` : 'ROUND COMPLETE';
  document.getElementById('whistleValue').value = nextStation ? nextStation.target : '';
}

async function stationDone() {
  const msg = document.getElementById('heatMsg');
  const btn = document.getElementById('doneBtn');
  btn.disabled = true;
  msg.textContent = '';
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'battle2_station_done', pin, athlete_id: currentAthlete.athlete_id }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed');

    // Always trust the server's returned state rather than assuming what
    // just happened — a dropped connection or slow response could otherwise
    // leave the on-screen state stuck out of sync with the sheet.
    heatState = { round: data.round, stationsFilled: data.stationsFilled || {}, cumulative: data.cumulative || {}, roundsCompleted: data.roundsCompleted || 0 };
    renderHeat();
  } catch (err) {
    // The write may well have succeeded even though this fetch failed
    // (dropped connection, backgrounded app) — pull true state with a
    // read-only GET before telling the judge anything is actually wrong.
    const resynced = await resyncHeat();
    msg.textContent = resynced
      ? 'Connection dropped, but re-synced — station list below is correct'
      : (err.message + ' — tap STATION DONE again to retry');
    msg.className = resynced ? 'msg ok' : 'msg err';
  }
  btn.disabled = false;
}

// Read-only resync: pulls the athlete's true current state from the server
// and re-renders. Returns true if a resync happened, false if there was
// nothing to resync (network still down, or genuinely no active heat).
async function resyncHeat() {
  if (!currentAthlete) return false;
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=battle2_status&athlete_id=${encodeURIComponent(currentAthlete.athlete_id)}`);
    const data = await res.json();
    if (!data.active) return false;
    heatState = { round: data.round, stationsFilled: data.stationsFilled || {}, cumulative: data.cumulative || {}, roundsCompleted: data.roundsCompleted || 0 };
    renderHeat();
    return true;
  } catch {
    return false;
  }
}

function toggleWhistle() {
  document.getElementById('whistleBox').classList.toggle('open');
}

async function confirmWhistle() {
  const value = document.getElementById('whistleValue').value;
  const msg = document.getElementById('heatMsg');
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'battle2_partial', pin, athlete_id: currentAthlete.athlete_id, value }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Failed');

    const cumulative = data.cumulative || {};
    document.getElementById('doneAthleteName').textContent = currentAthlete.name;
    document.getElementById('doneSummary').innerHTML = `
      <div class="result-line"><span>Rounds completed</span><span class="rl-val">${data.roundsCompleted || 0}</span></div>
      <div class="result-line"><span>Stopped at</span><span class="rl-val">${(STATIONS.find(s=>s.key===data.station)||{}).label || data.station}</span></div>
      ${STATIONS.map(s => `<div class="result-line"><span>${s.label} (total)</span><span class="rl-val">${cumulative[s.key] || 0} ${s.unit}</span></div>`).join('')}`;
    show('doneScreen');
  } catch (err) {
    // Check whether the heat actually ended despite the fetch failing —
    // if it's no longer "active", the partial almost certainly saved.
    let stillActive = true;
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=battle2_status&athlete_id=${encodeURIComponent(currentAthlete.athlete_id)}`);
      const data = await res.json();
      stillActive = !!data.active;
    } catch {}

    if (!stillActive) {
      document.getElementById('doneAthleteName').textContent = currentAthlete.name;
      document.getElementById('doneSummary').innerHTML = `
        <div class="result-line" style="display:block;">Connection dropped, but this heat is no longer active — it most likely saved. Please verify in the sheet.</div>`;
      show('doneScreen');
    } else {
      msg.textContent = err.message + ' — tap CONFIRM & END HEAT again to retry';
      msg.className = 'msg err';
    }
  }
}

function newAthlete() {
  currentAthlete = null;
  heatState = {};
  document.getElementById('athleteSelect').value = '';
  document.getElementById('startBtn').disabled = true;
  show('startScreen');
}

function logout() {
  sessionStorage.removeItem('judge_pin');
  location.href = 'index.html';
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
